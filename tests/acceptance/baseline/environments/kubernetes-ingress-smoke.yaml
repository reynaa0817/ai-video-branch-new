apiVersion: v1
kind: Pod
metadata:
  name: base002-ingress-backend
  namespace: ai-video-int
  labels:
    app: base002-ingress-backend
spec:
  restartPolicy: Never
  containers:
    - name: backend
      image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
      command:
        - sh
        - -ceu
        - mkdir -p /www; printf 'BASE-002 INGRESS PASS\n' >/www/index.html; exec httpd -f -p 8080 -h /www
---
apiVersion: v1
kind: Service
metadata:
  name: base002-ingress-backend
  namespace: ai-video-int
spec:
  selector:
    app: base002-ingress-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: base002-ingress
  namespace: ai-video-int
spec:
  ingressClassName: nginx
  rules:
    - host: base002.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: base002-ingress-backend
                port:
                  number: 8080
