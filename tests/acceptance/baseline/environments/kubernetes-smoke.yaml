apiVersion: v1
kind: Namespace
metadata:
  name: ai-video-int
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ai-video-hostpath-csi
provisioner: hostpath.csi.k8s.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  kind: fast
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: base002-smoke
  namespace: ai-video-int
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ai-video-hostpath-csi
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: base002-storage-smoke
  namespace: ai-video-int
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
      command: ["sh", "-ceu", "printf base002 > /evidence/probe && test $(cat /evidence/probe) = base002"]
      volumeMounts:
        - name: evidence
          mountPath: /evidence
  volumes:
    - name: evidence
      persistentVolumeClaim:
        claimName: base002-smoke
