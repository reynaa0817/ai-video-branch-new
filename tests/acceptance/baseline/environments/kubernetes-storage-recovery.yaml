apiVersion: v1
kind: Pod
metadata:
  name: base002-storage-recovery
  namespace: ai-video-int
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
      command: ["sh", "-ceu", "test $(cat /evidence/probe) = base002 && printf recovered > /evidence/recovery"]
      volumeMounts:
        - name: evidence
          mountPath: /evidence
  volumes:
    - name: evidence
      persistentVolumeClaim:
        claimName: base002-smoke
