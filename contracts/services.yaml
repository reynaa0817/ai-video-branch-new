{
  "schema_version": 1,
  "services": {
    "web-bff": {
      "path": "api/web-bff",
      "kind": "bff",
      "owns_facts": [],
      "may_write_business_facts": false
    },
    "studio": {
      "path": "services/studio",
      "kind": "core-fact-service",
      "owns_facts": [
        "Project", "Revision", "CreativeConstitution", "ChangeProposal",
        "ImpactPlan", "ProposalConfirmation", "GateApproval",
        "FinalReleaseConsent", "InteractionReceipt"
      ],
      "may_write_business_facts": true
    },
    "workflow": {
      "path": "services/workflow",
      "kind": "core-fact-service",
      "owns_facts": ["WorkflowRun", "LogicalTask", "WorkflowInbox", "SagaCursor"],
      "may_write_business_facts": true
    },
    "budget": {
      "path": "services/budget",
      "kind": "core-fact-service",
      "owns_facts": [
        "PricingQuoteVerification", "Reservation", "SpendAuthorization",
        "SpendAuthorizationReceipt", "BudgetLimitRevision", "LedgerEntry"
      ],
      "may_write_business_facts": true
    },
    "asset": {
      "path": "services/asset",
      "kind": "core-fact-service",
      "owns_facts": [
        "AssetSlot", "ArtifactVersion", "AdoptionRecord",
        "DependencyManifest", "ArtifactRegistrationReceipt"
      ],
      "may_write_business_facts": true
    },
    "model-gateway": {
      "path": "services/model-gateway",
      "kind": "core-fact-service",
      "owns_facts": [
        "ModelProfile", "ModelConfigSnapshot", "Attempt", "ModelTask",
        "ProviderCostFact", "ProviderDeletionRequest"
      ],
      "may_write_business_facts": true
    },
    "quality": {
      "path": "services/quality",
      "kind": "core-fact-service",
      "owns_facts": [
        "RuleSet", "QualityRun", "Finding", "Evidence",
        "WarningAcceptance", "QualityEligibilityAttestation"
      ],
      "may_write_business_facts": true
    },
    "delivery": {
      "path": "services/delivery",
      "kind": "core-fact-service",
      "owns_facts": ["ReleaseCandidateManifest", "ReleaseVersion", "ExportRecord"],
      "may_write_business_facts": true
    },
    "experience-projection": {
      "path": "services/experience-projection",
      "kind": "projection",
      "owns_facts": [],
      "owns_projections": ["ProjectExperienceView", "NotificationProjection"],
      "may_write_business_facts": false
    },
    "provider-worker": {
      "path": "workers/provider-worker",
      "kind": "execution-worker",
      "owns_facts": [],
      "may_write_business_facts": false
    },
    "media-worker": {
      "path": "workers/media-worker",
      "kind": "execution-worker",
      "owns_facts": [],
      "may_write_business_facts": false
    }
  },
  "forbidden_cross_service_segments": ["internal", "repository", "model", "dao"]
}
