# Story 1.3 service boundary registry.
# This file is the machine-readable source for ownership and independent build checks.
services:
  web-bff:
    path: api/web-bff
    kind: bff
    owns_facts: []
    may_write_business_facts: false
  studio:
    path: services/studio
    kind: core-fact-service
    owns_facts:
      - Project
      - Revision
      - CreativeConstitution
      - ChangeProposal
      - ImpactPlan
      - ProposalConfirmation
      - GateApproval
      - FinalReleaseConsent
      - InteractionReceipt
  workflow:
    path: services/workflow
    kind: core-fact-service
    owns_facts:
      - WorkflowRun
      - LogicalTask
      - WorkflowInbox
      - SagaCursor
  budget:
    path: services/budget
    kind: core-fact-service
    owns_facts:
      - PricingQuoteVerification
      - Reservation
      - SpendAuthorization
      - SpendAuthorizationReceipt
      - BudgetLimitRevision
      - LedgerEntry
  asset:
    path: services/asset
    kind: core-fact-service
    owns_facts:
      - AssetSlot
      - ArtifactVersion
      - AdoptionRecord
      - DependencyManifest
      - ArtifactRegistrationReceipt
  model-gateway:
    path: services/model-gateway
    kind: core-fact-service
    owns_facts:
      - ModelProfile
      - ModelConfigSnapshot
      - Attempt
      - ModelTask
      - ProviderCostFact
      - ProviderDeletionRequest
  quality:
    path: services/quality
    kind: core-fact-service
    owns_facts:
      - RuleSet
      - QualityRun
      - Finding
      - Evidence
      - WarningAcceptance
      - QualityEligibilityAttestation
  delivery:
    path: services/delivery
    kind: core-fact-service
    owns_facts:
      - ReleaseCandidateManifest
      - ReleaseVersion
      - ExportRecord
  experience-projection:
    path: services/experience-projection
    kind: projection
    owns_facts:
      - ProjectExperienceView
      - NotificationProjection
    may_write_business_facts: false
  provider-worker:
    path: workers/provider-worker
    kind: execution-worker
    owns_facts: []
    may_write_business_facts: false
  media-worker:
    path: workers/media-worker
    kind: execution-worker
    owns_facts: []
    may_write_business_facts: false

forbidden_patterns:
  - /internal/
  - /repository/
  - /model/
  - /dao/
